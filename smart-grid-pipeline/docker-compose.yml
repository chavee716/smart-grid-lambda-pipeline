version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    POSTGRES_HOST: postgres
    POSTGRES_DB: smartgrid
    POSTGRES_USER: grid_user
    POSTGRES_PASSWORD: grid_pass
    DATA_LAKE_ROOT: /data/lake
    BATCH_DROPZONE_PATH: /data/batch_dropzone
    SIMULATED_DAY_SECONDS: 300
  volumes:
    - ./batch_processing/dags:/opt/airflow/dags
    - .:/opt/airflow/project
    - airflow_logs:/opt/airflow/logs
    - data_lake:/data/lake
    - batch_dropzone:/data/batch_dropzone
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------
  # INGESTION: Kafka + Zookeeper
  # ---------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      retries: 10

  # ---------------------------------------------------------------------
  # STORAGE: Postgres (serving layer for both speed + batch outputs)
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smartgrid
      POSTGRES_USER: grid_user
      POSTGRES_PASSWORD: grid_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grid_user -d smartgrid"]
      interval: 5s
      retries: 10

  # Separate metadata DB for Airflow itself (kept independent of the domain DB)
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # STREAM PROCESSING: Spark Structured Streaming (speed layer)
  # ---------------------------------------------------------------------
  spark-stream-job:
    build:
      context: .
      dockerfile: Dockerfile.spark
    user: "0:0"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - data_lake:/data/lake
    working_dir: /app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_DB: smartgrid
      POSTGRES_USER: grid_user
      POSTGRES_PASSWORD: grid_pass
      DATA_LAKE_ROOT: /data/lake
      PYTHONPATH: /app
    command: >
      /opt/spark/bin/spark-submit
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      /app/stream_processing/spark_streaming_job.py

  # ---------------------------------------------------------------------
  # ORCHESTRATION: Airflow (batch layer)
  # ---------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

  # ---------------------------------------------------------------------
  # SIMULATED DATA SOURCES
  # ---------------------------------------------------------------------
  meter-streamer:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: python simulators/smart_meter_streamer.py

  batch-generator:
    build: .
    volumes:
      - batch_dropzone:/data/batch_dropzone
    environment:
      BATCH_DROPZONE_PATH: /data/batch_dropzone
    command: python simulators/daily_batch_generator.py

  # ---------------------------------------------------------------------
  # SERVING LAYER: FastAPI
  # ---------------------------------------------------------------------
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: smartgrid
      POSTGRES_USER: grid_user
      POSTGRES_PASSWORD: grid_pass
    command: uvicorn serving_api.main:app --host 0.0.0.0 --port 8000

  # ---------------------------------------------------------------------
  # OBSERVABILITY: health-check / alerting service
  # ---------------------------------------------------------------------
  healthcheck-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_DB: smartgrid
      POSTGRES_USER: grid_user
      POSTGRES_PASSWORD: grid_pass
    command: python observability/healthcheck.py

volumes:
  pg_data:
  airflow_pg_data:
  airflow_logs:
  data_lake:
  batch_dropzone:
